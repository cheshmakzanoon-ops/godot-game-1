name: NEEDLEBEAT tests and Android debug
on:
  push:
  workflow_dispatch:

jobs:
  game-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Import resources and check GDScript syntax
        run: godot --headless --editor --path . --import --quit
      - name: Engine-integrated gameplay and WAV smoke tests
        run: godot --headless --path . --script res://tests/smoke.gd
      - name: Deterministic four-record / music regression tests
        run: godot --headless --path . --script res://tests/full_flow.gd

  android-debug:
    needs: game-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK packages required by Godot 4.7
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'build-tools;35.0.1' 'platforms;android-35' 'cmdline-tools;latest' 'cmake;3.10.2.4988404' 'ndk;28.1.13356709'
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Import Godot resources
        run: godot --headless --editor --path . --import --quit
      - name: Configure Godot Android SDK and debug signing
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          fi
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
      - name: Export ARM64 debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug Android build/NEEDLEBEAT_DROP-debug.apk
      - name: Verify Android debug APK signature and package
        run: |
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose --print-certs build/NEEDLEBEAT_DROP-debug.apk
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging build/NEEDLEBEAT_DROP-debug.apk | head -12
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump xmltree build/NEEDLEBEAT_DROP-debug.apk AndroidManifest.xml | grep -q 'FileProvider'
      - uses: actions/upload-artifact@v4
        with:
          name: NEEDLEBEAT_DROP_Android_ARM64_Debug
          path: build/NEEDLEBEAT_DROP-debug.apk
          if-no-files-found: error
      - name: Export x86_64 debug APK for emulator runtime QA
        run: |
          sed -i 's/architectures\/arm64-v8a=true/architectures\/arm64-v8a=false/; s/architectures\/x86_64=false/architectures\/x86_64=true/' export_presets.cfg
          godot --headless --path . --export-debug Android build/NEEDLEBEAT_DROP-x86_64-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NEEDLEBEAT_DROP_Android_x86_64_Debug
          path: build/NEEDLEBEAT_DROP-x86_64-debug.apk
          if-no-files-found: error

  android-emulator:
    needs: android-debug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: NEEDLEBEAT_DROP_Android_x86_64_Debug
          path: build
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, launch, tap, export WAV and check sharesheet
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_4
          cores: 4
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/android_emulator_smoke.sh
      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEEDLEBEAT_DROP_Emulator_Evidence
          path: build/emulator-evidence/
          if-no-files-found: ignore
