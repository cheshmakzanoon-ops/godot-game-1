name: NEEDLEBEAT tests and Android debug
on:
  push:
  workflow_dispatch:

jobs:
  game-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Import resources and check GDScript syntax
        run: godot --headless --editor --path . --import --quit
      - name: Engine-integrated gameplay and WAV smoke tests
        run: godot --headless --path . --script res://tests/smoke.gd
      - name: Deterministic four-record / music regression tests
        run: godot --headless --path . --script res://tests/full_flow.gd

  android-debug:
    needs: game-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK packages required by Godot 4.7
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'build-tools;35.0.1' 'platforms;android-35' 'platforms;android-36' 'cmdline-tools;latest' 'cmake;3.10.2.4988404' 'ndk;28.1.13356709'
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Import Godot resources
        run: godot --headless --editor --path . --import --quit
      - name: Configure Godot Android SDK and debug signing
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          fi
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
      - name: Install Godot Android Gradle build template
        run: |
          godot --headless --editor --path . --install-android-build-template --quit
          test -f android/build/src/main/AndroidManifest.xml
          python tools/prepare_android_share.py
      - name: Export ARM64 debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug Android build/NEEDLEBEAT_DROP-debug.apk
      - name: Verify Android debug APK signature and package
        run: |
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose --print-certs build/NEEDLEBEAT_DROP-debug.apk
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging build/NEEDLEBEAT_DROP-debug.apk | head -12
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump xmltree build/NEEDLEBEAT_DROP-debug.apk AndroidManifest.xml | grep -q 'FileProvider'
          unzip -p build/NEEDLEBEAT_DROP-debug.apk classes.dex | strings | grep -q 'NeedlebeatShare'
      - uses: actions/upload-artifact@v4
        with:
          name: NEEDLEBEAT_DROP_Android_ARM64_Debug
          path: build/NEEDLEBEAT_DROP-debug.apk
          if-no-files-found: error
