name: Materialize NEEDLEBEAT alpha source
on:
  push:
    branches: [main]
    paths:
      - '.github/seed/**'
      - '.github/workflows/materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unpack source
        run: python .github/seed/unpack.py
      - name: Synthesize the original WAV files and launcher artwork
        run: |
          python -m pip install 'Pillow>=10,<12'
          python tools/generate_sounds.py
          mkdir -p art
          python tools/make_icon.py
      - name: Verify generated project and host tests
        run: |
          test -f project.godot
          test -f scenes/Main.tscn
          test -f audio/4/lead.wav
          test -f art/icon.png
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Push complete source and generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Add full NEEDLEBEAT DROP Godot 4 source and generated art/audio [skip ci]"
            git push origin HEAD:main
          fi
